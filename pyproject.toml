[tool.poetry]
name = "infuture"
version = "0.1.0"
description = "小智洞界未来"
authors = ["sunzhiwen@lixiang.com"]

[tool.poetry.dependencies]
python = "^3.10"  # Specify the Python version range
requests = "^2.28.1"  # Example of a package dependency
numpy = "^1.23.3"  # Add more dependencies as needed
pandas = "^2.2.3"
streamlit = "^1.41.1"
streamlit-extras = "^0.5.0"
streamlit-cookies-controller = "^0.0.4"

[tool.poetry.dev-dependencies]
pytest = "^7.1.2"  # Example of a development-only dependency

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"